steps:
# Step 1: Install dependencies
- name: 'node:20'
  entrypoint: 'bash'
  args: ['-c', 'npm ci']
  id: 'install-deps'

# Step 2: Run render with temp directory on large disk
- name: 'node:20'
  entrypoint: 'bash'
  args: ['-c', 'npm run render']
  id: 'render-video'
  env:
  - 'TEMP=/tmp'
  - 'TMP=/tmp'
  - 'PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium'
  volumes:
  - name: 'tmp-volume'
    path: '/tmp'
  dir: '/workspace'

# Step 3: Copy result to Cloud Storage (optional)
- name: 'gcr.io/cloud-builders/gsutil'
  args: ['cp', 'out/ss-seguros-reel.mp4', 'gs://SEU_BUCKET/ss-seguros-reel.mp4']
  id: 'upload-result'
  waitFor: ['render-video']

options:
  # Use machine with more RAM and CPU for rendering
  machineType: 'E2_HIGHCPU_8'  # 8 vCPU, 8GB RAM - increase if needed
  diskSizeGb: '100'           # 100GB disk for temp frames
  logging: 'CLOUD_LOGGING_ONLY'
  substitutionOption: 'ALLOW_LOOSE'

# Timeout for the whole build (default 10min, increase for video)
timeout: '7200s'  # 2 hours

# Artifacts to keep
artifacts:
  objects:
    location: 'gs://SEU_BUCKET/artifacts'
    paths: ['out/ss-seguros-reel.mp4']