name: Render Video

on:
  workflow_dispatch:  # manual trigger only

permissions:
  contents: read
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Chromium + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium fonts-liberation libasound2t64 \
            libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdbus-1-3 \
            libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libwayland-client0 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 \
            libxss1 libxtst6 xdg-utils ffmpeg

      - name: Render video
        env:
          TEMP: /tmp
          TMP: /tmp
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
        run: npm run render

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss-seguros-reel
          path: out/ss-seguros-reel.mp4
          retention-days: 7

      - name: Create/update GitHub Release (viewable in browser)
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: S&S Seguros Reel (latest)
          body: Render automático do reel S&S Seguros. | Duração: ~97s | Arquivo: ss-seguros-reel.mp4
          files: out/ss-seguros-reel.mp4
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ss-seguros-reel
          path: out/ss-seguros-reel.mp4
          retention-days: 7

      - name: Release on tag (optional)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: out/ss-seguros-reel.mp4
          tag_name: ${{ github.ref_name }}
          name: S&S Seguros Reel ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}