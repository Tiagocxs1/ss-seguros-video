name: Render Video

on:
  workflow_dispatch:  # manual trigger
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'scripts/**', 'package*.json']

permissions:
  contents: read
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install edge-tts Pillow requests

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libwayland-client0 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 libxss1 libxtst6 xdg-utils ffmpeg

      - name: Create audio dirs
        run: mkdir -p public/audio/sfx

      - name: Generate TTS & SFX
        run: |
          python scripts/gerar_narracao_21.py
          python scripts/gerar_sfx.py

      - name: Download Pexels vertical assets
        run: python scripts/download_pexels_vertical.py

      - name: Render video
        env:
          TEMP: /tmp
          TMP: /tmp
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
        run: npm run render

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss-seguros-reel
          path: out/ss-seguros-reel.mp4
          retention-days: 7

      - name: Release (optional - on tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: out/ss-seguros-reel.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}