name: Render Video

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y chromium fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 libnss3 libwayland-client0 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 libxss1 libxtst6 xdg-utils ffmpeg
      - run: npm run render
        env:
          TEMP: /tmp
          TMP: /tmp
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      - uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: latest
          name: S&S Seguros Reel (latest)
          body: Render automatico do reel S&S Seguros.
          files: out/ss-seguros-reel.mp4
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ss-seguros-reel
          path: out/ss-seguros-reel.mp4
          retention-days: 7